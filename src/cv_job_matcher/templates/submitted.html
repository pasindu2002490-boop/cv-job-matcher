{% extends "base.html" %}
{% block title %}Submitted · CareerSync{% endblock %}
{% block content %}
  <h1>Your search has started.</h1>
  <p class="intro">Live job sources can take several minutes. The CSV reports will be emailed to <strong>{{ email }}</strong> when processing finishes.</p>
  <div id="status" class="ok">Queued&hellip;</div>
  <a href="/">Submit another CV</a>
  <script>
    const statusUrl = {{ url_for('status', task_id=task_id) | tojson }};
    const statusBox = document.getElementById('status');
    async function refresh() {
      try {
        const response = await fetch(statusUrl);
        const task = await response.json();
        statusBox.textContent = task.message || task.status;
        if (!['complete', 'failed'].includes(task.status)) setTimeout(refresh, 3000);
      } catch (_) {
        statusBox.textContent = 'Checking status...';
        setTimeout(refresh, 5000);
      }
    }
    refresh();
  </script>
{% endblock %}
