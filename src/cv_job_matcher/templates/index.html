<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CV Job Matcher</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; background: radial-gradient(circle at 20% 0%, #16316c, #070b19 46%); color: #f7faff; }
    main { width: min(680px, 100%); padding: 34px; border: 1px solid #294a88; border-radius: 24px; background: rgba(10, 20, 45, .9); box-shadow: 0 24px 80px #0008; }
    .eyebrow { color: #52d8ff; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 8px 0; font-size: clamp(2rem, 6vw, 3.3rem); line-height: 1; }
    .intro { color: #b9c6df; line-height: 1.6; margin-bottom: 28px; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    label { display: grid; gap: 8px; font-weight: 700; }
    .full { grid-column: 1 / -1; }
    input { width: 100%; padding: 13px 14px; border: 1px solid #365786; border-radius: 11px; background: #0d1931; color: white; font: inherit; }
    input:focus { outline: 2px solid #29c7f5; border-color: transparent; }
    .checks { display: flex; flex-wrap: wrap; gap: 18px; color: #cfdaed; }
    .checks label { display: flex; align-items: center; gap: 8px; font-weight: 500; }
    .checks input { width: auto; accent-color: #22c8f5; }
    button { grid-column: 1 / -1; border: 0; border-radius: 12px; padding: 15px; font: inherit; font-weight: 900; color: #04101c; background: linear-gradient(90deg, #27d3ff, #65f2bd); cursor: pointer; }
    button:hover { filter: brightness(1.08); }
    .error { padding: 12px; border-radius: 10px; background: #6d1d31; color: #ffe3ea; margin-bottom: 20px; }
    small { color: #94a5c3; font-weight: 400; }
    @media (max-width: 580px) { main { padding: 24px; } form { grid-template-columns: 1fr; } .full, button { grid-column: 1; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">AI-powered job search</div>
    <h1>Turn your CV into live job matches.</h1>
    <p class="intro">Upload your CV and choose your target. We will search live sources concurrently, review every related vacancy, and email the CSV reports to you automatically.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form action="/submit" method="post" enctype="multipart/form-data">
      <label class="full">Your CV
        <input type="file" name="cv" accept=".pdf,.docx,.txt,.md" required>
        <small>PDF, DOCX, TXT or Markdown &mdash; maximum 10 MB</small>
      </label>
      <label>Email address
        <input type="email" name="email" placeholder="you@example.com" required>
      </label>
      <label>Experience (years)
        <input type="number" name="experience_years" min="0" max="60" step="0.5" placeholder="2" required>
      </label>
      <label>Target country
        <input type="text" name="country" value="Sri Lanka" required>
      </label>
      <label>Target position
        <input type="text" name="position" placeholder="AI Engineer" required>
      </label>
      <div class="checks full">
        <label><input type="checkbox" name="include_remote_global"> Include worldwide remote jobs</label>
        <label><input type="checkbox" name="web_discovery" checked> Expand with web discovery</label>
      </div>
      <button type="submit">Find jobs and email my CSV reports</button>
    </form>
  </main>
</body>
</html>
