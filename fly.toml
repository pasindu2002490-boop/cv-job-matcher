# fly.toml app configuration file generated for free Fly.io deploy
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'cv-job-matcher'
primary_region = 'sin'

[build]

[env]
  OLLAMA_FALLBACK_ENABLED = '0'
  WEB_WORKERS = '2'
  UPLOAD_ROOT = '/tmp/cv-job-matcher/uploads'
  OUTPUT_ROOT = '/tmp/cv-job-matcher/results'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
