[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-job-matcher"
version = "0.1.0"
description = "Evidence-backed CV tailoring and live job matching by country."
requires-python = ">=3.9"
dependencies = ["pypdf>=4.0", "flask>=3.0", "gunicorn>=22.0; platform_system != 'Windows'"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
