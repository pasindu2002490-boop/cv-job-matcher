services:
  - type: web
    name: cv-job-matcher
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: gunicorn --workers 1 --threads 4 --timeout 600 --bind 0.0.0.0:$PORT cv_job_matcher.web:app
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: WEB_WORKERS
        value: "2"
      - key: MAX_CV_UPLOAD_MB
        value: "10"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "1"
      - key: SMTP_USE_SSL
        value: "0"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GOOGLE_CSE_API_KEY
        sync: false
      - key: GOOGLE_CSE_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
