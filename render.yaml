services:
  - type: web
    name: cv-job-matcher
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: gunicorn --workers 1 --threads 4 --timeout 600 --bind 0.0.0.0:$PORT cv_job_matcher.web:app
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: WEB_WORKERS
        value: "2"
      - key: SOURCE_AGENT_WORKERS
        value: "8"
      - key: SOURCE_RESULT_LIMIT
        value: "5000"
      - key: SOURCE_INVENTORY_CACHE_MINUTES
        value: "30"
      - key: WEB_DISCOVERY_MAX_QUERIES_PER_SOURCE
        value: "4"
      - key: WEB_DISCOVERY_MAX_DETAIL_PAGES_PER_SOURCE
        value: "30"
      - key: WEB_DISCOVERY_DETAIL_WORKERS
        value: "6"
      - key: LLM_CV_CHAR_LIMIT
        value: "16000"
      - key: LLM_JOB_DESCRIPTION_CHAR_LIMIT
        value: "2500"
      - key: MAX_CV_UPLOAD_MB
        value: "10"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "1"
      - key: SMTP_USE_SSL
        value: "0"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GOOGLE_CSE_API_KEY
        sync: false
      - key: GOOGLE_CSE_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      # Render's free web service does not run the local Ollama daemon.
      # Enable only when OLLAMA_BASE_URL points to a separately hosted service.
      - key: OLLAMA_FALLBACK_ENABLED
        value: "0"
